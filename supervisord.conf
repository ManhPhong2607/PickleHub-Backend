directory=/app/authen
command=dotnet PickleHub.Authen.dll
environment=ASPNETCORE_HTTP_PORTS="5001",ASPNETCORE_ENVIRONMENT="Production",DOTNET_gcServer="0",DOTNET_GCTrimCommit="1",DOTNET_GCHeapHardLimit="35000000"
