[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:gateway]
directory=/app/gateway
command=dotnet PickleHub.Gateway.dll
environment=ASPNETCORE_HTTP_PORTS="8080",ASPNETCORE_ENVIRONMENT="Production",DOTNET_gcServer="0",DOTNET_GCTrimCommit="1",DOTNET_GCHeapHardLimit="35000000"
autostart=true
autorestart=true
priority=1
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

