services:
  # ----------------------------------------------------------------------------
  # 1. PUBLIC WEB SERVICE: YARP API GATEWAY (PORT 8080)
  # ----------------------------------------------------------------------------
  - type: web
    name: picklehub-gateway
    env: docker
    dockerfilePath: PickleHub.Gateway/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - fromGroup: picklehub-shared-env
      - key: ASPNETCORE_ENVIRONMENT
        value: Docker
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080
      - key: Cors__AllowedOrigins
        value: "*"

  # ----------------------------------------------------------------------------
  # 2. PRIVATE SERVICES: 11 MICROSERVICES
  # ----------------------------------------------------------------------------
  - type: pserv
    name: authen-service
    env: docker
    dockerfilePath: PickleHub.Authen/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - fromGroup: picklehub-shared-env
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080

