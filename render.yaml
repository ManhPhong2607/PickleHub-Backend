      - key: Jwt__SecretKey
        fromGroup: picklehub-shared-env
        envVarKey: JWT_SECRET_KEY
      - key: Jwt__Issuer
        fromGroup: picklehub-shared-env
        envVarKey: JWT_ISSUER
      - key: Security__InternalApiKey
        fromGroup: picklehub-shared-env
        envVarKey: INTERNAL_API_KEY

  - type: pserv
