# ==============================================================================
# RENDER BLUEPRINT - PICKLEHUB MICROSERVICES (DATABASE-PER-SERVICE PATTERN)
# ==============================================================================

envVarGroups:
  - name: picklehub-shared-env
    envVars:
      - key: AUTHEN_DB_CONN
        sync: false
      - key: CATALOG_DB_CONN
        sync: false
      - key: CUSTOMER_DB_CONN
        sync: false
      - key: SYSTEM_DB_CONN
        sync: false
      - key: INVENTORY_DB_CONN
        sync: false
      - key: AUDITLOG_DB_CONN
        sync: false
      - key: CARTORDER_DB_CONN
        sync: false
      - key: PAYMENT_DB_CONN
        sync: false
      - key: NOTIFICATION_DB_CONN
        sync: false
      - key: REVIEW_DB_CONN
        sync: false
      - key: BLOG_DB_CONN
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ISSUER
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

services:
  # ----------------------------------------------------------------------------
  # 1. PUBLIC WEB SERVICE: YARP API GATEWAY (PORT 8080)
  # ----------------------------------------------------------------------------
  - type: web
    name: picklehub-gateway
    env: docker
    dockerfilePath: PickleHub.Gateway/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - fromGroup: picklehub-shared-env
      - key: ASPNETCORE_ENVIRONMENT
        value: Docker
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080
      - key: Jwt__SecretKey
        fromGroup: picklehub-shared-env
        envVarKey: JWT_SECRET_KEY
      - key: Jwt__Issuer
        fromGroup: picklehub-shared-env
        envVarKey: JWT_ISSUER
      - key: Cors__AllowedOrigins
        value: "*"

  # ----------------------------------------------------------------------------
  # 2. PRIVATE MICROSERVICES (DATABASE-PER-SERVICE)
  # ----------------------------------------------------------------------------
  - type: pserv
    name: authen-service
    env: docker
    dockerfilePath: PickleHub.Authen/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - fromGroup: picklehub-shared-env
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080
      - key: ConnectionStrings__AuthenDb
        fromGroup: picklehub-shared-env
        envVarKey: AUTHEN_DB_CONN
      - key: Jwt__SecretKey
        fromGroup: picklehub-shared-env
        envVarKey: JWT_SECRET_KEY
      - key: Jwt__Issuer
        fromGroup: picklehub-shared-env
        envVarKey: JWT_ISSUER
      - key: Resend__ApiKey
        fromGroup: picklehub-shared-env
        envVarKey: RESEND_API_KEY
      - key: SeedAdmin__Email
        fromGroup: picklehub-shared-env
        envVarKey: SEED_ADMIN_EMAIL
      - key: SeedAdmin__Password
        fromGroup: picklehub-shared-env
        envVarKey: SEED_ADMIN_PASSWORD

  - type: pserv
    name: catalog-service
    env: docker
    dockerfilePath: PickleHub.Catalog/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - fromGroup: picklehub-shared-env
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080
      - key: ConnectionStrings__CatalogDb
        fromGroup: picklehub-shared-env
        envVarKey: CATALOG_DB_CONN
      - key: Jwt__SecretKey
        fromGroup: picklehub-shared-env
        envVarKey: JWT_SECRET_KEY
      - key: Jwt__Issuer
        fromGroup: picklehub-shared-env
        envVarKey: JWT_ISSUER
      - key: Security__InternalApiKey
        fromGroup: picklehub-shared-env
        envVarKey: INTERNAL_API_KEY
      - key: Cloudinary__CloudName
        fromGroup: picklehub-shared-env
        envVarKey: CLOUDINARY_CLOUD_NAME
      - key: Cloudinary__ApiKey
        fromGroup: picklehub-shared-env
        envVarKey: CLOUDINARY_API_KEY
      - key: Cloudinary__ApiSecret
        fromGroup: picklehub-shared-env
        envVarKey: CLOUDINARY_API_SECRET

  - type: pserv
