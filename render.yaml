services:
  # ----------------------------------------------------------------------------
  # SINGLE WEB SERVICE HOSTING ALL MICROSERVICES VIA SUPERVISOR
  # --------------------------------------------------------------------
  - type: web
    name: picklehub-backend
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - fromGroup: picklehub-shared-env
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080
      - key: Cors__AllowedOrigins
        value: "*"
      - key: DOTNET_gcServer
        value: "0"
