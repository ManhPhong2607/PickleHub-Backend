        envVarKey: INVENTORY_DB_CONN
      - key: Jwt__SecretKey
        fromGroup: picklehub-shared-env
        envVarKey: JWT_SECRET_KEY
      - key: Jwt__Issuer
        fromGroup: picklehub-shared-env
        envVarKey: JWT_ISSUER
